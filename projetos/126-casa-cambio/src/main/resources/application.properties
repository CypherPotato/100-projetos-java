spring.application.name=casa-cambio

# H2 em arquivo: os dados ficam em data\casa-cambio.mv.db, relativo à pasta de onde o Tomcat é iniciado
spring.datasource.url=jdbc:h2:file:./data/casa-cambio
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2 em /h2-console (use a mesma URL, usuário e senha acima)
spring.h2.console.enabled=true

# O Hibernate cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
